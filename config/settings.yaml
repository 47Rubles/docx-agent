# Конфигурация DocxGen Agent.
#
# ВАЖНО: в этом файле нет и не должно быть ключей. Секреты подставляются
# из переменной окружения в момент загрузки конфигурации — плейсхолдер
# ${LLM_API_KEY} превращается в значение только в памяти.
#
# Локально:   scripts\set-api-key.ps1  (кладёт ключ в переменную уровня User)
# В CI:       GitHub Actions Secret с именем LLM_API_KEY
# Подробности: docs\SECRETS.md

llm:
  provider: groq
  base_url: https://api.groq.com/openai/v1

  # Плейсхолдер. Значение приходит из переменной окружения.
  api_key: "${LLM_API_KEY}"

  # Резервные источники ключа, если LLM_API_KEY не задана.
  # Список живёт внутри профиля провайдера, поэтому при переключении
  # меняется вместе с ним и старый ключ не подставится случайно.
  api_key_fallbacks:
    - GROQ_API_KEY

  # Groq принимает ключ как Authorization: Bearer. У Google наоборот:
  # ключ формата AQ.* принимается только заголовком x-goog-api-key,
  # а Authorization: Bearer с ним даёт 401.
  auth_style: bearer

  model: openai/gpt-oss-120b
  timeout_seconds: 120
  max_retries: 3
  temperature: 0.2
  max_output_tokens: 8192

generation:
  # Лимит токенов ответа для провайдеров с параметром max_tokens.
  max_tokens: 6000
  # Сколько раз агент пытается починить невалидный JSON от модели.
  max_ast_repair_attempts: 2

paths:
  templates_dir: assets/templates
  xslt_dir: assets/xslt
  output_dir: output

document:
  template: assets/templates/default.docx
  enable_toc: true
  enable_track_changes: false
  max_heading_depth: 3

